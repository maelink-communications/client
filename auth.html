<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="assets/img/logo.png">
    <title>maelink</title>
    <link rel="stylesheet" href="titlebar/titlebar.css">
    <link rel="stylesheet" href="assets/client.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cantarell:ital,wght@0,400;0,700;1,400;1,700&family=Rethink+Sans:ital,wght@0,400..800;1,400..800&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --sidebar-width: 0;
        }

        .titlebar {
            background: var(--glass);
            backdrop-filter: blur(16px);
        }

        .decorations img {
            background: var(--glass-alt);
        }

        .modal {
            width: min(560px, 92%);
            max-width: 640px;
            min-width: 280px;
            min-height: 0 !important;
            height: auto !important;
            max-height: calc(100vh - 48px) !important;
            overflow: auto !important;
            display: block !important;
            position: fixed !important;
            top: 50% !important;
            left: 50% !important;
            transform: translate(-50%, -50%) !important;
            z-index: 9999 !important;
            padding: 18px !important;
            box-sizing: border-box !important;
        }

        .modal .center {
            height: auto !important;
        }

        .auth-anchor .modal {
            position: relative !important;
            transform: none !important;
            pointer-events: auto !important;
            display: block !important;
        }

        .auth-anchor .modal {
            min-height: 0 !important;
            height: auto !important;
            max-height: calc(100vh - 48px) !important;
            overflow: auto !important;
            padding: 22px !important;
        }

        .auth-anchor .modal .center.content {
            padding-bottom: 22px !important;
        }

        .biglogo.auth {
            pointer-events: none;
            width: 160px;
        }

        .auth-inner {
            display: flex;
            width: 100%;
            box-sizing: border-box;
            padding: 6px 0 12px 0;
            flex-direction: column;
        }

        .auth-inner input {
            margin: 8px 0;
        }

        .auth-inner button {
            margin: 6px 0;
        }

        .auth-inner .textclar {
            margin-top: 8px;
            align-self: center;
        }

        #banned-modal { display: none; position: fixed; inset: 0; z-index: 100000; }
        #banned-modal .banned-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.6); display:flex; align-items:center; justify-content:center; }
        #banned-modal .banned-box { background: #0f0f12; color: #eee; padding: 18px; border-radius: 10px; min-width: 300px; max-width: 92%; box-shadow: 0 10px 40px rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.04); }
        #banned-modal .banned-box h3 { margin: 0 0 6px 0; font-size: 18px; }
        #banned-modal .banned-box .btn { margin-left: 8px; }
    </style>
</head>

<body>
    <script>
        const loginForm = `
            <div class="auth-inner content">
                <h2>Hello!</h2>
                <p>Pick up right where you left off.</p>
                <input id="userInput" placeholder="Username" type="text" autocomplete="nope">
                <div class="password-container">
                    <input id="passInput" placeholder="Password" type="password" autocomplete="new-password">
                    <button type="button" class="password-toggle" onclick="togglePassword('passInput', this)">
                        <img src="assets/img/eyeclosed.svg" alt="Show password">
                    </button>
                </div>
                <button id="loginButton">Login</button>
                <a class="textclar" href="#" id="to-signup">Don't have an account yet?</a>
            </div>
        `;

        const signupForm = `
            <div class="auth-inner content">
                <h2>Welcome!</h2>
                <p>Joining maelink is just a few clicks away.</p>
                <input id="userInput" placeholder="Username" type="text" autocomplete="nope">
                <div class="password-container">
                    <input id="passInput" placeholder="Password" type="password" autocomplete="new-password">
                    <button type="button" class="password-toggle" onclick="togglePassword('passInput', this)">
                        <img src="assets/img/eyeclosed.svg" alt="Show password">
                    </button>
                </div>
                <input id="codeInput" placeholder="Verification code" type="text" autocomplete="nope">
                <button id="signupButton">Join</button>
                <a class="textclar" href="#" id="to-login">Already have an account?</a>
            </div>
        `;

        function showLogin() {
            document.getElementById('modal').innerHTML = loginForm;
            document.getElementById('to-signup').onclick = showSignup;
            const loginBtn = document.getElementById('loginButton');
            const userEl = document.getElementById('userInput');
            const passEl = document.getElementById('passInput');
            let keyMode = false;

            function enableKeyMode() {
                keyMode = true;
                userEl.value = 'System';
                userEl.disabled = true;
                passEl.placeholder = 'System key';
                passEl.type = 'text';
                loginBtn.textContent = 'Login (key)';
                loginBtn.onclick = () => logMaelinkKey(userEl, passEl);
                if (!document.getElementById('keyModeNotice')) {
                    const n = document.createElement('div');
                    n.id = 'keyModeNotice';
                    n.style.fontSize = '12px';
                    n.style.marginTop = '6px';
                    n.style.textAlign = 'center';
                    n.textContent = 'System key mode active';
                    document.querySelector('.auth-inner').appendChild(n);
                }
            }

            function disableKeyMode() {
                keyMode = false;
                userEl.disabled = false;
                if (userEl.value === 'System') userEl.value = '';
                passEl.placeholder = 'Password';
                passEl.type = 'password';
                loginBtn.textContent = 'Login';
                loginBtn.onclick = () => logMaelink(userEl, passEl);
                const n = document.getElementById('keyModeNotice');
                if (n) n.remove();
            }

            loginBtn.onclick = () => logMaelink(userEl, passEl);


            let seqStage = 0;
            let seqTimer = null;
            function resetSeq() {
                seqStage = 0;
                if (seqTimer) { clearTimeout(seqTimer); seqTimer = null; }
            }

            document.addEventListener('keydown', function onKeySeq(e) {
                try {
                    const key = (e.key || '').toLowerCase();
                    if (seqStage === 0) {
                        if (e.ctrlKey && e.shiftKey && key === 'm') {
                            seqStage = 1;
                            seqTimer = setTimeout(resetSeq, 1000);
                        }
                    } else if (seqStage === 1) {
                        if (e.ctrlKey && e.shiftKey && key === 'k') {
                            if (!keyMode) enableKeyMode(); else disableKeyMode();
                            resetSeq();
                        }
                    }
                    if (key === 'escape' || key === 'esc') {
                        if (keyMode) disableKeyMode();
                    }
                } catch (err) {
                    console.error('key sequence listener error', err);
                }
            });
            
            requestAnimationFrame(repositionLogo);
        }

        function showSignup() {
            document.getElementById('modal').innerHTML = signupForm;
            document.getElementById('to-login').onclick = showLogin;
            document.getElementById('signupButton').onclick = () => {
                joinMaelink(document.getElementById('userInput'), document.getElementById('passInput'), document.getElementById('codeInput'));
            };
            requestAnimationFrame(repositionLogo);
        }

        function togglePassword(inputId, button) {
            const input = document.getElementById(inputId);
            const img = button.querySelector('img');

            if (input.type === 'password') {
                input.type = 'text';
                img.src = 'assets/img/eye.svg';
                img.alt = 'Hide password';
            } else {
                input.type = 'password';
                img.src = 'assets/img/eyeclosed.svg';
                img.alt = 'Show password';
            }
        }



        function showError(reason) {
            if (reason === 'tokenRequired') {
                return;
            }
            const existingError = document.querySelector('.error-message');
            if (existingError) existingError.remove();

            const errorDiv = document.createElement('div');
            errorDiv.className = 'error-message';

            if (typeof reason === 'object' && reason !== null) {
                if (reason.reason === 'banned' || reason.code === 403) {
                    showBannedModal(reason);
                    return;
                }
                reason = String(reason.reason || reason.message || JSON.stringify(reason));
            }

            if (reason === 'userExists') {
                errorDiv.textContent = 'This username is already taken. Please choose a different one.';
            } else if (reason === 'userNotFound') {
                errorDiv.textContent = 'We couldn\'t find an account with that username. Please check that you entered it correctly.';
            } else if (reason === 'cannotConnect') {
                errorDiv.textContent = 'Could not connect to the server. Please check your internet connection.';
            } else if (reason === 'badPswd') {
                errorDiv.textContent = 'The credentials you entered are incorrect. Please try again.';
            } else if (reason === 'badCode') {
                errorDiv.textContent = 'The verification code you entered is incorrect.';
            } else {
                errorDiv.textContent = `We ran into an error. If this persists, please show this to support: ${reason}`;
                console.error('Authentication error:', reason);
            }

            document.body.appendChild(errorDiv);
        }

        function showBannedModal(details) {
            let modal = document.getElementById('banned-modal');
            if (!modal) {
                modal = document.createElement('div');
                modal.id = 'banned-modal';
                modal.innerHTML = `
                    <div class="banned-overlay">
                        <div class="banned-box">
                            <h3>Banned</h3>
                            <div id="banned-message" style="margin-top:6px;color:#ddd;font-size:14px"></div>
                            <div id="banned-until" style="margin-top:10px;color:#bbb;font-size:13px"></div>
                            <div style="margin-top:14px;text-align:right">
                                <button id="banned-close" class="btn">Close</button>
                            </div>
                        </div>
                    </div>
                `;
                document.body.appendChild(modal);
                modal.querySelector('#banned-close').addEventListener('click', hideBannedModal);
            }

            const msgEl = modal.querySelector('#banned-message');
            const untilEl = modal.querySelector('#banned-until');
            const human = details && details.message ? details.message : 'Your account is banned.';
            msgEl.textContent = human;
            if (details && details.until) {
                try {
                    const d = new Date(details.until);
                    if (!isNaN(d)) {
                        untilEl.textContent = 'Ban expires: ' + d.toLocaleString();
                        untilEl.style.display = '';
                    } else {
                        untilEl.textContent = '';
                        untilEl.style.display = 'none';
                    }
                } catch (e) { untilEl.style.display = 'none'; }
            } else {
                untilEl.style.display = 'none';
            }

            modal.style.display = 'block';
        }

        function hideBannedModal() {
            const modal = document.getElementById('banned-modal');
            if (modal) modal.style.display = 'none';
        }

        function showErrorNorm(reason) {
            const existingError = document.querySelector('.error-message');
            if (existingError) existingError.remove();

            const errorDiv = document.createElement('div');
            errorDiv.className = 'error-message';

            errorDiv.textContent = `${reason}`;

            document.body.appendChild(errorDiv);
        }

        document.addEventListener('DOMContentLoaded', () => {
            connect();
            if (localStorage.getItem('username') && localStorage.getItem('session_token')) {
                window.location.href = 'client';
            } else {
                showLogin();
            }
            const big = document.getElementById('biglogo');
            if (big) big.classList.add('auth');
            requestAnimationFrame(repositionLogo);
            const modalEl = document.querySelector('.modal');
            if (modalEl) {
                const mo = new MutationObserver(() => requestAnimationFrame(repositionLogo));
                mo.observe(modalEl, { childList: true, subtree: true });
            }
        });
    </script>
    <script>
        function repositionLogo() {
            const modal = document.querySelector('.modal');
            const logo = document.getElementById('biglogo');
            if (!modal || !logo) return;
            const modalRect = modal.getBoundingClientRect();
            const logoRect = logo.getBoundingClientRect();
            let newTop = modalRect.top + window.scrollY - logoRect.height - 18;
            const minTop = 8 + window.scrollY;
            if (newTop < minTop) newTop = minTop;
            logo.style.top = newTop + 'px';
            logo.style.left = '50%';
            logo.style.transform = 'translateX(-50%)';
        }

        window.addEventListener('resize', () => requestAnimationFrame(repositionLogo));
        window.addEventListener('load', () => requestAnimationFrame(repositionLogo));
    </script>
    <div class="pill">
        <h1 class="disclaimer" style="display: none;">CLOSED BETA</h1>
        <p class="disclaimer2" id="build-info" style="display: none;"></p>
        <script>
            document.addEventListener('keydown', (e) => {
                if (e.ctrlKey && e.key === 'i') {
                    document.querySelector('.disclaimer').style.display = 'block';
                    document.querySelector('.disclaimer2').style.display = 'block';
                }
            });
            document.addEventListener('keyup', (e) => {
                if (e.key === 'Control' || e.key === 'i') {
                    document.querySelector('.disclaimer').style.display = 'none';
                    document.querySelector('.disclaimer2').style.display = 'none';
                }
            });
        </script>
    </div>
    <div class="image"></div>
    <div class="background"></div>
    <div class="titlebar">
        <h1 class="title">maelink</h1>
        <img class="logo" src="assets/img/icon.svg" alt="">
        <div class="decorations">
            <img id="min-button" src="titlebar/min.svg" alt="">
            <img id="max-button" src="titlebar/max.svg" alt="">
            <img id="close-button" class="close-button" src="titlebar/close.svg" alt="">
        </div>
    </div>
    <img class="biglogo" id="biglogo" src="assets/img/biglogo.png" alt="maelink logo">
    <div class="modal" id="modal"></div>
    <script src="config.js"></script>
    <script src="web.js"></script>
    <script src="comm.js"></script>
</body>

</html>
